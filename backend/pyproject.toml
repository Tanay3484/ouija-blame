[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ouija"
version = "0.1.0"
description = "Ouija Blame: ask why a line of code exists; the ghost of whoever wrote it answers only in their own recorded words"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["ouija*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
